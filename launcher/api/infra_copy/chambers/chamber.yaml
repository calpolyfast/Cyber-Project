apiVersion: apps/v1
kind: Deployment
metadata:
    name: "chamber-${INSTANCE_ID}"
    labels:
        app: chamber
        instance: "${INSTANCE_ID}"
spec:
    replicas: 1
    selector:
        matchLabels:
            app: chamber
            instance: "${INSTANCE_ID}"
    template:
        metadata:
            labels:
                app: chamber
                instance: "${INSTANCE_ID}"
        spec:
            volumes:
                - name: pgdata
                  emptyDir: {}
            containers:
                - name: postgres
                  image: postgres:16
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        value: postgres
                      - name: POSTGRES_PASSWORD
                        value: postgres
                      - name: POSTGRES_DB
                        value: devdb
                  volumeMounts:
                      - name: pgdata
                        mountPath: /var/lib/postgresql/data

                - name: app
                  image: "${APP_IMAGE}"
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 3000
                  env:
                      # app connects to postgres in the same Pod
                      - name: DATABASE_URL
                        value: "postgresql://postgres:postgres@localhost:5432/devdb"
                      - name: CLOUDINARY_CLOUD_NAME
                        value: "${CLOUDINARY_CLOUD_NAME}"
                      - name: CLOUDINARY_API_KEY
                        value: "${CLOUDINARY_API_KEY}"
                      - name: CLOUDINARY_API_SECRET
                        value: "${CLOUDINARY_API_SECRET}"
                      - name: JWT_SECRET
                        value: "${JWT_SECRET}"
                
                - name: browser
                  image: "${PLAYWRIGHT_IMAGE}"
                  imagePullPolicy: Always
                  command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata:
    name: "chamber-${INSTANCE_ID}"
    annotations:
      kubernetes.io/ingress.class: traefik
    labels:
        app: chamber
        instance: "${INSTANCE_ID}"
spec:
    selector:
        app: chamber
        instance: "${INSTANCE_ID}"
    ports:
        - name: http
          port: 80
          targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: "chamber-${INSTANCE_ID}"
    labels:
        app: chamber
        instance: "${INSTANCE_ID}"
spec:
    ingressClassName: traefik
    rules:
        - host: "${INSTANCE_ID}.${BASE_DOMAIN}"
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: "chamber-${INSTANCE_ID}"
                            port:
                                number: 80