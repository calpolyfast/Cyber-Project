apiVersion: v1
kind: Namespace
metadata:
    name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: traefik-ingress-controller
    namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: traefik-ingress-controller
rules:
    - apiGroups: [""]
      resources: ["services", "endpoints", "secrets", "nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "ingressclasses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses/status"]
      verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: traefik-ingress-controller
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: traefik-ingress-controller
subjects:
    - kind: ServiceAccount
      name: traefik-ingress-controller
      namespace: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: traefik
    namespace: traefik
spec:
    replicas: 1
    selector:
        matchLabels:
            app: traefik
    template:
        metadata:
            labels:
                app: traefik
        spec:
            serviceAccountName: traefik-ingress-controller
            containers:
                - name: traefik
                  image: traefik:v3.5
                  args:
                      - --providers.kubernetesingress=true
                      - --entrypoints.web.address=:80
                      - --api.insecure=true
                  ports:
                      - name: web
                        containerPort: 80
                      - name: admin
                        containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
    name: traefik
    namespace: traefik
spec:
    type: NodePort
    selector:
        app: traefik
    ports:
        - name: web
          port: 80
          targetPort: 80
          nodePort: 32080
        - name: admin
          port: 8080
          targetPort: 8080
          nodePort: 32081
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
    name: traefik
spec:
    controller: traefik.io/ingress-controller