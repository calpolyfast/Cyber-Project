apiVersion: apps/v1
kind: Deployment
metadata:
    name: launcher
    labels:
        app: launcher
spec:
    replicas: 1
    selector:
        matchLabels:
            app: launcher
    template:
        metadata:
            labels:
                app: launcher
        spec:
            serviceAccountName: launcher-kube-controller
            containers:
                - name: launcher
                  image: ${LAUNCHER_APP_IMAGE}
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 3000
                  readinessProbe:
                      httpGet:
                          path: /api
                          port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: launcher-kube-controller
    namespace: launcher
---
apiVersion: v1
kind: Service
metadata:
    name: launcher
    labels:
        app: launcher
spec:
    selector:
        app: launcher
    ports:
        - name: http
          port: 80
          targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: launcher
    labels:
        app: launcher
spec:
    ingressClassName: traefik
    rules:
        - host: localhost
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: launcher
                            port:
                                number: 80