apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: launcher
  name: deployment-reader
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-deployments-binding
  namespace: launcher
subjects:
- kind: ServiceAccount
  name: launcher-kube-controller
roleRef:
  kind: Role
  name: deployment-reader
  apiGroup: rbac.authorization.k8s.io